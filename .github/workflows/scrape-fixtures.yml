name: Scrape Fixtures & Tables

on:
  # Run once daily at 5am UTC
  schedule:
    - cron: '0 5 * * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run fixtures scraper
        run: npm run scrape

      - name: Run tables scraper
        run: npm run scrape:tables

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json data/tables.json
          git diff --cached --quiet && echo "No changes." || git commit -m "chore: update fixtures & tables"

      - name: Push
        run: git diff HEAD~1 HEAD --quiet 2>/dev/null && echo "Nothing to push." || git push
