name: Scrape Fixtures & Tables

on:
  # Run once daily at 5am UTC
  schedule:
    - cron: '0 5 * * *'
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run fixtures scraper
        run: npm run scrape

      - name: Run tables scraper
        run: npm run scrape:tables

      - name: Commit updated data
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fixtures.json data/tables.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update fixtures & tables"
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push
        run: git diff HEAD~1 HEAD --quiet 2>/dev/null && echo "Nothing to push." || git push

      # Diffs data/fixtures.json HEAD~1 → HEAD (the commit just made) and pushes
      # any new results to subscribers via the live site's /push/send route.
      # Never fails the job; problems show up as a workflow warning.
      - name: Notify new results
        if: steps.commit.outputs.committed == 'true'
        env:
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/push-notify.mjs
