name: Deploy to App Engine

on:
  push:
    branches: [main]
    # The fixtures scraper commits data/fixtures.json straight to main on its
    # own schedule; the live app fetches that file's raw GitHub URL at request
    # time, so a data-only commit doesn't need a redeploy.
    paths-ignore:
      - 'data/**'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: stockport-badmin-1531321435304
          workload_identity_provider: projects/503068006443/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@stockport-badmin-1531321435304.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write .env
        run: |
          cat <<EOF > .env
          CONTENTFUL_SPACE=${{ secrets.CONTENTFUL_SPACE }}
          CONTENTFUL_TOKEN=${{ secrets.CONTENTFUL_TOKEN }}
          EOF

      - name: Deploy to App Engine
        run: gcloud app deploy --quiet
