name: Push Notifications (manual)

# Manual sends only. The scheduled reminders and result notifications run from
# App Engine cron (cron.yaml → /push/cron/* in routes/push.js), because GitHub's
# schedules were starting 4–8 hours late. Use this to send a test notification
# or to re-send a reminder by hand; it goes through scripts/push-notify.mjs →
# /push/send and uses data/fixtures.json on main.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Which reminder to send ("test" sends the message below to every subscriber)'
        type: choice
        options: [tonight, tomorrow, test]
        default: tonight
      message:
        description: 'Test notification text (only used when kind is "test")'
        required: false
        default: 'Test notification from Hyde Badminton Club'
      date:
        description: 'Pretend it is this date (YYYY-MM-DD). Leave blank for today.'
        required: false
      dry_run:
        description: 'Only print what would be sent'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No npm ci: the reminder path only uses Node built-ins and lib/*.js.
      - name: Send reminders
        env:
          PUSH_SEND_SECRET: ${{ secrets.PUSH_SEND_SECRET }}
          SITE_URL: ${{ vars.SITE_URL }}
          KIND: ${{ inputs.kind }}
          DATE: ${{ inputs.date }}
          DRY_RUN: ${{ inputs.dry_run }}
          MESSAGE: ${{ inputs.message }}
        run: |
          if [ "$KIND" = "test" ]; then
            args=(--test "${MESSAGE:-Test notification from Hyde Badminton Club}")
          else
            args=(--reminders "$KIND")
            [ -n "$DATE" ] && args+=(--date "$DATE")
          fi
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          node scripts/push-notify.mjs "${args[@]}"
